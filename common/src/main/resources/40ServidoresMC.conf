    enabled: true
    serverStatsTtlSeconds: 60
    voteCheckNegativeTtlSeconds: 5
}
placeholderapi: {
    enabled: true
    formats: {
        unavailable: "N/A"
        numberZero: "0"
        booleanTrue: "true"
        booleanFalse: "false"
        dateTime: "dd/MM/yyyy HH:mm"
    }
}
