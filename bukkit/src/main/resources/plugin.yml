name: 40ServidoresMC
main: com.cadiducho.cservidoresmc.bukkit.BukkitPlugin
version: 3.2.2
author: Cadiducho
api-version: 1.13
description: Enlace para servidores de la web 40ServidoresMC!
softdepend: [PlaceholderAPI]
commands:
    vote40:
        description: Comando principal de 40ServidoresMC
        aliases: [votar40, voto40, mivoto40]
    update40:
        description: Comando para verificar version
        aliases: [actualizar40, upd40]
    reload40:
        description: Comando para recargar el plugin
        aliases: [recargar40, config40]
    stats40:
        description: Estadisticas de tu servidor
        aliases: []
    metrics40:
        description: Metricas internas del plugin
        aliases: []
    streak40:
        description: Administra rachas de voto
        aliases: []
    test40:
        description: Testea el premio que das a tus jugadores
permissions:
    40servidores.voto:
        description: Permite validar el voto del jugador
        default: true
    40servidores.actualizar:
        description: Permite comprobar actualizaciones del plugin
        default: op
    40servidores.recargar:
        description: Permite recargar la configuración del plugin
        default: op
    40servidores.stats:
        description: Permite consultar las estadísticas de voto
        default: op
    40servidores.metrics:
        description: Permite consultar métricas internas del plugin
        default: op
    40servidores.streak:
        description: Permite ver y resetear rachas de voto
        default: op
    40servidores.streak.view:
        description: Permite consultar rachas de voto con información técnica
        default: op
    40servidores.test:
        description: Permite probar las recompensas configuradas
        default: op
