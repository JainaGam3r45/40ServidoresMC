# 40ServidoresMC configuration
# Documentation: https://github.com/JainaGam3r45/40ServidoresMC

configVersion: 7
debug: false

api:
  # Your 40ServidoresMC server API key.
  # Keep this value private.
  key: "CHANGE_ME"

  # HTTP timeout in milliseconds.
  readTimeout: 5000
  connectTimeout: 5000

  # Retry failed transient requests such as timeouts and 5xx responses.
  retries: 2
  retryBackoffMillis: 250

messages:
  # Prefix used by plugin messages.
  prefix: "&8[&b40ServidoresMC&8]"

  # Sent when the player has voted and can claim the reward.
  voteClaim: "&aThanks for voting! Run the command again to claim your reward."

  # Sent when the player already received today's reward.
  alreadyRewarded: "&aYou already voted and received your reward. You can vote again in &e%time%&a."

broadcast:
  # Announce vote rewards to all online players.
  enabled: true
  message: "&eThanks &6{0} &efor voting! They received a reward. Use &6&l/vote40 &eto get yours too."

rewards:
  # Commands executed as console when a player receives a vote reward.
  commands:
    - "minecraft:give {0} minecraft:baked_potato 32"
    - "minecraft:give {0} minecraft:golden_apple 3"

streakRewards:
  # Extra rewards for consecutive voting streak milestones.
  3:
    - "give %player% diamond 1"
  7:
    - "give %player% emerald 5"

cache:
  # Cache API responses to reduce HTTP requests.
  enabled: true
  serverStatsTtlSeconds: 60
  voteCheckNegativeTtlSeconds: 5

autoReward:
  # Recheck votes shortly after a player uses the vote command.
  enabled: true
  recheckDelaysSeconds:
    - 10
    - 30
    - 60
  maxAttempts: 3
  debug: false

voteReminder:
  # Notify players when their local vote cooldown has expired.
  enabled: true
  message: "&aYou can vote again on 40ServidoresMC. Use &2/vote40&a to receive your reward."
  checkIntervalSeconds: 300

placeholderapi:
  # Optional PlaceholderAPI integration and fallback values.
  enabled: true
  formats:
    unavailable: "N/A"
    numberZero: "0"
    booleanTrue: "true"
    booleanFalse: "false"
    dateTime: "dd/MM/yyyy HH:mm"
