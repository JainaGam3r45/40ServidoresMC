# 40ServidoresMC configuration
# Documentation: https://github.com/JainaGam3r45/40ServidoresMC

configVersion: 8
debug: false

api:
  # Your 40ServidoresMC server API key.
  # Keep this value private.
  key: "CHANGE_ME"

  # HTTP timeout in milliseconds.
  readTimeout: 5000
  connectTimeout: 5000

  # Retry failed transient requests such as timeouts and 5xx responses.
  retries: 2
  retryBackoffMillis: 250

messages:
  # Prefix used by plugin messages.
  prefix: "&8[&b40ServidoresMC&8]"

  # Sent after the player receives a vote reward.
  voteClaim: "&aThanks for voting! Here is your reward."

  # Sent when the player already received today's reward.
  alreadyRewarded: "&aYou already voted and received your reward. You can vote again in &e%time%&a."

  commands:
    noPermission: "&cYou do not have permission to use this command."
    onlyPlayer: "&cThis command can only be used by players."
    unexpectedError: "&cAn unexpected error occurred."
    cooldown: "&eYou can use &6/%command% &eagain in &6%time%&e."

  apiException: "&cAn exception occurred. Contact an administrator."

  vote:
    checking: "&7Checking vote..."
    notVotedToday: "&6You have not voted today! You can do it at &a "
    listedButNotClaimable: "&eYour vote is registered but cannot be claimed yet. Try again in a few minutes or ask an admin."
    error: "&7An error occurred. Try again later or contact an administrator."
    rewardSaveFailed: "&cCould not save your rewarded vote. Contact an administrator."

  stats:
    exception: "&cAn exception occurred. Check the console or contact an administrator."
    lines:
      - "&9==> &7%server% &eis ranked &a#%rank%"
      - "&bVotes today: &6%votesToday%"
      - "&bRewarded votes today: &6%rewardedToday%"
      - "&bWeekly votes: &6%votesWeek%"
      - "&bRewarded weekly votes: &6%rewardedWeek%"
      - "&bLast 20 votes: %lastVotes%"

  streak:
    unavailable: "&cThe streak system is not available."
    loading: "&eStreak data for &6%player% &eis loading. Try again in a few seconds."
    own:
      lines:
        - "&9Your vote streak"
        - "&bCurrent streak: &6%streak% days"
        - "&bBest streak: &6%bestStreak% days"
        - "&bLast vote: &6%lastVote%"
        - "&bYou can vote again: &6%canVote%"
        - "&aVote today to keep your streak!"
    admin:
      lines:
        - "&9Streak for &e%player%&9:"
        - "&bCurrent streak: &6%streak%"
        - "&bBest streak: &6%bestStreak%"
        - "&bLast vote day: &6%lastVote%"
        - "&bUUID: &6%uuid%"
        - "&bRewarded milestones: &6%milestones%"
    usage:
      lines:
        - "&cUsage: /streak40 view <player>"
        - "&cUsage: /streak40 reset <player>"
    resetSuccess: "&aStreak for &e%player% &ahas been reset."
    resetFailed: "&cCould not reset the streak for &e%player%&c."
    formats:
      none: "none"
      today: "today"
      yesterday: "yesterday"
      daysAgo: "%days% days ago"
      noVotesYet: "no votes recorded"
      canVoteNow: "now"
      canVoteIn: "in %time%"

  metrics:
    lines:
      - "&9==> &7Internal metrics since last startup"
      - "&bAPI requests: &6%apiRequests%"
      - "&bAPI failures: &6%apiFailures%"
      - "&bRetries: &6%retries%"
      - "&bHTTP rejections: &6%httpRejections%"
      - "&bVote checks: &6%voteChecks%"
      - "&bRewards delivered: &6%rewardsDelivered%"

  reload:
    lines:
      - "&aConfiguration reloaded successfully."
      - "&aRunning version &f%version%"

  test:
    lines:
      - "&b40ServidoresMC test platform:"
      - ""
      - "%voteClaim%"

broadcast:
  # Announce vote rewards to all online players.
  enabled: true
  message: "&eThanks &6%player% &efor voting! They received a reward. Use &6&l/vote40 &eto get yours too."

rewards:
  # Commands executed as console when a player receives a vote reward.
  commands:
    - "minecraft:give %player% minecraft:baked_potato 32"
    - "minecraft:give %player% minecraft:golden_apple 3"

streakRewards:
  # Extra rewards for consecutive voting streak milestones.
  3:
    - "give %player% diamond 1"
  7:
    - "give %player% emerald 5"

cache:
  # Cache API responses to reduce HTTP requests.
  enabled: true
  serverStatsTtlSeconds: 60
  voteCheckNegativeTtlSeconds: 5

autoReward:
  # Recheck votes shortly after a player uses the vote command.
  enabled: true
  recheckDelaysSeconds:
    - 10
    - 30
    - 60
  maxAttempts: 3
  debug: false

voteReminder:
  # Notify players when their local vote cooldown has expired.
  enabled: true
  message: "&aYou can vote again on 40ServidoresMC. Use &2/vote40&a to receive your reward."
  checkIntervalSeconds: 300

updater:
  # Notify the console when a new plugin version is available.
  notifyConsole: true
  # Notify administrators when they join and an update is already known.
  notifyAdminsOnJoin: true
  joinNotificationDelaySeconds: 3

placeholderapi:
  # Optional PlaceholderAPI integration and fallback values.
  enabled: true
  formats:
    unavailable: "N/A"
    numberZero: "0"
    booleanTrue: "true"
    booleanFalse: "false"
    dateTime: "dd/MM/yyyy HH:mm"
